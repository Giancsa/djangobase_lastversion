{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Meu Site{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'cadastro/style.css' %}">
</head>

<body>

    <nav>
        <P></P>
        <a href="{% url 'index' %}">Início</a> |
        <a href="{% url 'contato' %}">Fale Conosco</a> |
        <a href="{% url 'adicionar' %}">Nova pessoa</a> |
        {% if user.is_authenticated %}
        Olá, {{ user.username }}! |
        <form method="POST" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit">Sair</button>
        </form>
        {% else %}
        <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
        <P></P>

    </nav>

    <hr>

    <main>
        {% block conteudo %}{% endblock %}
    </main>

    <hr>
    <footer>
        <p>&copy; 2026 {{ nome | default:"Visitante" }}</p>
    </footer>

</body>

</html>
