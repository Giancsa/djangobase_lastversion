{% extends 'cadastro/base.html' %}

{% load widget_tweaks %}

{% block titulo %}Cadastro - Adicionar Pessoa{% endblock %}

{% block conteudo %}
<article>
    <h2>Adicionar Pessoa</h2>

    <form method="POST">
        {% csrf_token %}
        

         {% for field in form %}
    <p class="mb-3">
        {{ field.label_tag }}
        {{ field }}
    </p>
    {% endfor %}
        <button type="submit">Salvar</button>
    </form>
</article>
{% endblock %}
